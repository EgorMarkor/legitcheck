{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мобильная версия</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style>
    .clickable-login {
      position: relative;
      cursor: pointer;
    }
    .clickable-login::after {
      content: "";
      position: absolute;
      inset: 0;
    }

    .pressable {
      transition: transform .06s ease, filter .12s ease, box-shadow .12s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
      border-radius: 1rem;
    }
    .pressable:active,
    .pressable.is-pressed {
      transform: translateY(1.5px) scale(0.98);
      filter: brightness(.98);
      box-shadow: inset 0 3px 10px rgba(0,0,0,.18);
    }
    .pressable:focus-visible {
      outline: 2px solid #70a5ff;
      outline-offset: 2px;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 min-h-screen flex flex-col items-center justify-center text-center text-white px-6">

  <div class="max-w-sm mx-auto">
    <div class="mb-8">
      <img src="{% static 'head_page/group-90010.svg' %}" alt="Logo" class="w-20 h-20 mx-auto opacity-80 mb-4">
      <h1 class="text-2xl font-semibold leading-snug">
        Мобильная версия приложения<br>
        работает из <span class="text-green-400">телеграм-бота</span>
      </h1>
    </div>

    <a href="https://t.me/LegitLogisticsBot"
       target="_blank"
       class="clickable-login pressable inline-block bg-green-500 hover:bg-green-400 active:bg-green-600 text-white text-lg font-medium py-3 px-8 rounded-xl shadow-md transition-all duration-200">
      Перейти
    </a>

    <div class="mt-10 text-sm text-gray-400">
      © 2019 – 2025 Legit Check. Все права защищены.
    </div>
  </div>

  <script>
    // эффект "нажатия" для всех pressable
    (function() {
      function pressStart(e) {
        const el = e.target.closest('.pressable');
        if (!el) return;
        el.classList.add('is-pressed');
      }
      function pressEnd() {
        document.querySelectorAll('.pressable.is-pressed')
          .forEach(el => el.classList.remove('is-pressed'));
      }
      document.addEventListener('pointerdown', pressStart);
      document.addEventListener('pointerup', pressEnd);
      document.addEventListener('pointercancel', pressEnd);
      document.addEventListener('mouseleave', pressEnd);
    })();
  </script>

</body>
</html>
