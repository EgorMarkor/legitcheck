{% load static %}
<!doctype html>
<html>
{% include 'head.html' %}
<style>
  .brend {
    width: 9rem;
    height: 9rem;
  }

  .numbers {
    font-weight: 700;
    font-size: 1.045rem;
    line-height: 14.63px;
    letter-spacing: 0px;

  }
  .check-btn {
    --promo-button-state: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
    background: transparent;
    color: #464F5D;
    isolation: isolate;
    overflow: hidden;
    position: relative;
    transition: color 0.45s ease, transform 0.2s ease, opacity 0.2s ease;
  }

  .check-btn::before,
  .check-btn::after {
    border-radius: inherit;
    content: "";
    inset: 0;
    position: absolute;
    transition: opacity 0.55s ease;
    z-index: -1;
  }

  .check-btn::before {
    background: linear-gradient(180deg, #171C24 0%, #11151A 100%);
    opacity: 1;
  }

  .check-btn::after {
    background: var(--promo-button-state);
    opacity: 0;
  }

  .check-btn.is-ready,
  .check-btn.is-valid,
  .check-btn.is-invalid {
    color: #FFFFFF;
  }

  .check-btn.is-ready::after,
  .check-btn.is-valid::after,
  .check-btn.is-invalid::after {
    opacity: 1;
  }

  .name_pos {
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.6rem;
    letter-spacing: -5%;
    vertical-align: middle;
  }

  .bg_sidebar {
    background: linear-gradient(180deg, rgba(29, 36, 48, 0.85) 0%, rgba(14, 17, 21, 0.85) 100%);
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .green_button {
    background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
  }

  .bg_card {
    background: linear-gradient(180deg, rgba(23, 28, 36, 0.75) 0%, rgba(17, 21, 26, 0.75) 100%);
  }

  .border_card {
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .check-btn.is-ready,
  .check-btn.is-valid {
    --promo-button-state: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
  }
  .check-btn.is-invalid {
    --promo-button-state: rgba(251, 82, 82, 0.10);
    color: #FB5252 !important;
  }

  .promo-visual {
    isolation: isolate;
  }

  .gradient-blur {
    border-radius: 5771.375rem;
    height: 18rem;
    left: 50%;
    opacity: 0.7;
    overflow: hidden;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%) rotate(9.409deg) scale(1.01, 0.99);
    transform-origin: center;
    width: 18rem;
    z-index: 0;
  }

  .gradient-blur::before,
  .gradient-blur::after {
    border-radius: inherit;
    content: "";
    inset: 0;
    position: absolute;
    transition: opacity 0.7s ease;
  }

  .gradient-blur::before {
    background: radial-gradient(circle, rgba(125, 125, 125, 0.29) 0%, rgba(125, 125, 125, 0.2) 38%, rgba(125, 125, 125, 0) 72%);
    opacity: 1;
  }

  .gradient-blur::after {
    opacity: 0;
  }

  .gradient-blur.is-valid::after {
    background: radial-gradient(circle, rgba(12, 200, 139, 0.29) 0%, rgba(12, 200, 139, 0.2) 38%, rgba(12, 200, 139, 0) 72%);
    opacity: 1;
  }

  .gradient-blur.is-invalid::after {
    background: radial-gradient(circle, rgba(255, 58, 61, 0.4) 0%, rgba(255, 58, 61, 0.26) 38%, rgba(255, 58, 61, 0) 72%);
    opacity: 1;
  }

</style>
<body class="text-gray-100 font-sans">
  <main id="page-content" data-page>
  <div class="mx-auto pb-[11rem]">
    <!-- Верхняя панель -->
    {% include 'header.html' %}
    <div class="promo-visual relative flex items-center justify-center">
      <div
        id="promoGlow"
        class="gradient-blur {% if promo_status == 'valid' %}is-valid{% elif promo_status == 'invalid' %}is-invalid{% endif %}"
      ></div>
      <img src="{% static 'promo_ticket.png' %}" class="relative z-10 mt-6 text-center w-[20rem] h-auto">
    </div>
    <section class="px-6">
        <div class="font-bold text-[1.6rem] text-center">Активируйте промокод</div>
        <form id="promoForm" method="post" class="mt-4">
          {% csrf_token %}
          <input
            id="promoCodeInput"
            name="promo_code"
            value="{{ promo_code_value }}"
            placeholder="Введите промокод"
            class="
              w-full
              bg_black
              px-6
              py-4
              rounded-[12px]
              border-none
              focus:outline-none
              text-[1.2rem] leading-[1.25rem]
              font-google-sans font-medium
              text-white
              placeholder:text-[#464F5D]
            "
          />
          <button
            id="promoSubmitButton"
            type="submit"
            class="check-btn px-[2rem] py-[1rem] w-full rounded-[1.2rem] mt-4 font-semibold text-center text-[1.2rem] active:scale-[0.99]
              {% if promo_status == 'valid' %}
                is-valid
              {% elif promo_status == 'invalid' %}
                is-invalid
              {% endif %}"
          >
            <span id="promoSubmitLabel" class="relative z-10">
              {% if promo_status == 'valid' %}
                Активировано +{{ credited_amount }} ₽
              {% elif promo_status == 'invalid' %}
                Данный промокод не найден
              {% else %}
                Проверить
              {% endif %}
            </span>
          </button>
        </form>

        <div
          id="promoMessage"
          class="hidden"
        >
          {{ promo_message }}
        </div>

        <script>
          (function () {
            const form = document.getElementById('promoForm');
            const input = document.getElementById('promoCodeInput');
            const button = document.getElementById('promoSubmitButton');
            const buttonLabel = document.getElementById('promoSubmitLabel');
            const glow = document.getElementById('promoGlow');
            const message = document.getElementById('promoMessage');

            if (!form || !input || !button || !buttonLabel || !glow || !message) return;

            function setState(status, text, creditedAmount) {
              glow.classList.toggle('is-valid', status === 'valid');
              glow.classList.toggle('is-invalid', status === 'invalid');
              button.classList.toggle('is-ready', status === 'ready');
              button.classList.toggle('is-valid', status === 'valid');
              button.classList.toggle('is-invalid', status === 'invalid');

              message.classList.add('hidden');
              message.classList.toggle('text-[#0CC88B]', status === 'valid');
              message.classList.toggle('text-[#FB5252]', status === 'invalid');
              message.textContent = text || '';

              if (status === 'valid') {
                buttonLabel.textContent = `Активировано +${creditedAmount || ''} ₽`;
              } else if (status === 'invalid') {
                buttonLabel.textContent = text || 'Данный промокод не найден';
              } else if (status === 'ready') {
                buttonLabel.textContent = 'Проверить';
              } else {
                buttonLabel.textContent = 'Проверить';
              }
            }

            input.addEventListener('input', () => {
              setState(input.value.trim() ? 'ready' : 'idle', '', null);
            });

            form.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!input.value.trim()) return;

              setState('idle', '', null);
              void glow.offsetWidth;
              button.disabled = true;
              button.classList.add('opacity-70');
              buttonLabel.textContent = 'Проверяем...';

              try {
                const response = await fetch(form.action || window.location.href, {
                  method: 'POST',
                  body: new FormData(form),
                  headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                  },
                  credentials: 'same-origin',
                });

                const data = await response.json();
                setState(data.status, data.message, data.credited_amount);
              } catch (error) {
                setState('invalid', 'Не удалось проверить промокод', null);
              } finally {
                button.disabled = false;
                button.classList.remove('opacity-70');
              }
            });
          })();
        </script>

        <div class="flex items-center justify-center mt-4 font-medium text-[#0CC88B] ">
          <button onclick="(function(){var tg=window.Telegram&&window.Telegram.WebApp;if(tg&&typeof tg.openTelegramLink==='function'){tg.openTelegramLink('https://t.me/legitcheck');}else{window.open('https://t.me/legitcheck','_blank','noopener');}})();">У меня нет промокода, но хочу получить</button>
        </div>

        <script>
          window.addEventListener('load', () => {
            const input = document.getElementById('promoCodeInput');
            if (input) input.focus();
          });
        </script>

          
    </section>

  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          window.history.back();
          tg.BackButton.hide();
        });
      }
    })();</script>

  {% include 'sidebar.html' %}
  </main>
</body>
</html>
