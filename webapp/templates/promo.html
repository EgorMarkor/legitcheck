{% load static %}
<!doctype html>
<html>
{% include 'head.html' %}
<style>
  .brend {
    width: 9rem;
    height: 9rem;
  }

  .numbers {
    font-weight: 700;
    font-size: 1.045rem;
    line-height: 14.63px;
    letter-spacing: 0px;

  }

  .name_pos {
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.6rem;
    letter-spacing: -5%;
    vertical-align: middle;
  }

  .bg_sidebar {
    background: linear-gradient(180deg, rgba(29, 36, 48, 0.85) 0%, rgba(14, 17, 21, 0.85) 100%);
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .green_button {
    background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
  }

  .bg_card {
    background: linear-gradient(180deg, rgba(23, 28, 36, 0.75) 0%, rgba(17, 21, 26, 0.75) 100%);
  }

  .border_card {
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .check-btn {
    transition: .3s ease;
  }

  .check-btn.is-valid {
    background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%) !important;
    color: #FFFFFF !important;
  }
  .check-btn.is-invalid {
    background: #FB52521A !important;
    color: #FB5252 !important;
  }

</style>
<body class="text-gray-100 font-sans">
  <div class="mx-auto">
    <!-- Верхняя панель -->
    {% include 'header.html' %}

    <img src="{% static 'phone.png' %}" class="mt-6 text-center w-full h-auto">
    <section class="px-6">
        <div class="font-bold text-[1.6rem]">Активируйте промокод</div>
        <form method="post" class="mt-4">
          {% csrf_token %}
          <input
            id="promoCodeInput"
            name="promo_code"
            value="{{ promo_code_value }}"
            placeholder="Введите промокод"
            class="
              w-full
              bg-transparent
              border-none
              focus:outline-none
              text-[1.6rem] leading-[1.25rem]
              font-google-sans font-bold
              text-white
              placeholder:text-[#FFF]/50
            "
          />
          <button
            type="submit"
            class="check-btn px-[2rem] py-[1rem] w-full rounded-[1.2rem] mt-4 font-semibold text-center text-[1.2rem]
              {% if promo_status == 'valid' %}
                is-valid
              {% elif promo_status == 'invalid' %}
                is-invalid
              {% else %}
                bg_black text-[#464F5D]
              {% endif %}"
          >
            {% if promo_status == 'valid' %}
              Активировано +{{ credited_amount }} ₽
            {% elif promo_status == 'invalid' %}
              Промокод не применён
            {% else %}
              Проверить
            {% endif %}
          </button>
        </form>

        {% if promo_message %}
          <div class="mt-3 text-[1rem] {% if promo_status == 'valid' %}text-[#35E6AD]{% else %}text-[#FB5252]{% endif %}">
            {{ promo_message }}
          </div>
        {% endif %}

        <script>
          window.addEventListener('load', () => {
            const input = document.getElementById('promoCodeInput');
            if (input) input.focus();
          });
        </script>

          
    </section>

  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          window.history.back();
          tg.BackButton.hide();
        });
      }
    })();</script>

  {% include 'sidebar.html' %}
</body>
</html>
