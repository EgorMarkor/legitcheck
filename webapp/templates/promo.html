{% load static %}
<!doctype html>
<html>
{% include 'head.html' %}
<style>
  .brend {
    width: 9rem;
    height: 9rem;
  }

  .numbers {
    font-weight: 700;
    font-size: 1.045rem;
    line-height: 14.63px;
    letter-spacing: 0px;

  }
  

  .check-btn {
    transition: background 0.45s ease, color 0.45s ease, transform 0.2s ease, opacity 0.2s ease;
  }

  .name_pos {
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.6rem;
    letter-spacing: -5%;
    vertical-align: middle;
  }

  .bg_sidebar {
    background: linear-gradient(180deg, rgba(29, 36, 48, 0.85) 0%, rgba(14, 17, 21, 0.85) 100%);
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .green_button {
    background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
  }

  .bg_card {
    background: linear-gradient(180deg, rgba(23, 28, 36, 0.75) 0%, rgba(17, 21, 26, 0.75) 100%);
  }

  .border_card {
    border: 1px solid;
    border-image-source: linear-gradient(180deg, rgba(179, 214, 255, 0.03) 0%, rgba(179, 214, 255, 0) 100%);
  }

  .check-btn {
    transition: .3s ease;
  }

  .check-btn.is-valid {
    background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%) !important;
    color: #FFFFFF !important;
  }
  .check-btn.is-invalid {
    background: #FB52521A !important;
    color: #FB5252 !important;
  }

  .gradient-blur {
  background: rgba(125, 125, 125, 0.29);
  border-radius: 5771.375rem;
  opacity: 0.7;
  width: 13.443000000000001rem;
  height: 13.916999999999998rem;
  position: absolute;
  z-index: 0;
  transform-origin: 0 0;
  transform: rotate(9.409deg) scale(1.01, 0.99);
  filter: blur(6rem);
  transition: background 0.7s ease;
}

  .gradient-blur.is-valid {
    background: rgba(12, 200, 139, 0.29);
  }

  .gradient-blur.is-invalid {
    background: rgba(255, 58, 61, 0.4);
  }

  .check-btn {
  transition: all 0.3s ease;
}

.check-btn.typing {
  background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%); /* зелёный */
  color: white;
}

</style>
<body class="text-gray-100 font-sans">
  <div class="mx-auto">
    <!-- Верхняя панель -->
    {% include 'header.html' %}
    <div class="relative flex items-center justify-center">
      <div
        id="promoGlow"
        class="gradient-blur {% if promo_status == 'valid' %}is-valid{% elif promo_status == 'invalid' %}is-invalid{% endif %}"
      ></div>
      <img src="{% static 'promo_ticket.png' %}" class="relative z-10 mt-6 text-center w-[20rem] h-auto">
    </div>
    <section class="px-6">
        <div class="font-bold text-[1.6rem] text-center">Активируйте промокод</div>
        <form id="promoForm" method="post" class="mt-4">
          {% csrf_token %}
          <input
            id="promoCodeInput"
            name="promo_code"
            value="{{ promo_code_value }}"
            placeholder="Введите промокод"
            class="
              w-full
              bg_black
              px-6
              py-4
              rounded-[12px]
              border-none
              focus:outline-none
              text-[1.2rem] leading-[1.25rem]
              font-google-sans font-medium
              text-white
              placeholder:text-[#464F5D]
            "
          />
          <button
            id="promoSubmitButton"
            type="submit"
            class="check-btn px-[2rem] py-[1rem] w-full rounded-[1.2rem] mt-4 font-semibold text-center text-[1.2rem]
              {% if promo_status == 'valid' %}
                is-valid
              {% elif promo_status == 'invalid' %}
                is-invalid
              {% else %}
                bg_black text-[#464F5D]
              {% endif %}"
          >
            {% if promo_status == 'valid' %}
              Активировано +{{ credited_amount }} ₽
            {% elif promo_status == 'invalid' %}
              Данный промокод не найден
            {% else %}
              Проверить
            {% endif %}
          </button>
        </form>
        <script>
          const input = document.getElementById('promoCodeInput');
          const button = document.querySelector('.check-btn');

          input.addEventListener('input', () => {
            if (input.value.trim().length > 0) {
              button.classList.add('typing');
            } else {
              button.classList.remove('typing');
            }
          });
        </script>

        <script>
          (function () {
            const form = document.getElementById('promoForm');
            const input = document.getElementById('promoCodeInput');
            const button = document.getElementById('promoSubmitButton');
            const glow = document.getElementById('promoGlow');
            const message = document.getElementById('promoMessage');

            if (!form || !input || !button || !glow || !message) return;

            function setState(status, text, creditedAmount) {
              glow.classList.toggle('is-valid', status === 'valid');
              glow.classList.toggle('is-invalid', status === 'invalid');
              button.classList.toggle('is-valid', status === 'valid');
              button.classList.toggle('is-invalid', status === 'invalid');

              message.classList.toggle('hidden', !text);
              message.classList.toggle('text-[#0CC88B]', status === 'valid');
              message.classList.toggle('text-[#FB5252]', status === 'invalid');
              message.textContent = text || '';

              if (status === 'valid') {
                button.textContent = `Активировано +${creditedAmount || ''} ₽`;
              } else if (status === 'invalid') {
                button.textContent = text || 'Данный промокод не найден';
              } else {
                button.textContent = 'Проверить';
              }
            }

            input.addEventListener('input', () => {
              setState('idle', '', null);
            });

            form.addEventListener('submit', async (event) => {
              event.preventDefault();
              if (!input.value.trim()) return;

              button.disabled = true;
              button.classList.add('opacity-70');

              try {
                const response = await fetch(form.action || window.location.href, {
                  method: 'POST',
                  body: new FormData(form),
                  headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                  },
                  credentials: 'same-origin',
                });

                const data = await response.json();
                setState(data.status, data.message, data.credited_amount);
              } catch (error) {
                setState('invalid', 'Не удалось проверить промокод', null);
              } finally {
                button.disabled = false;
                button.classList.remove('opacity-70');
              }
            });
          })();
        </script>

        <div class="flex items-center justify-center mt-4 font-medium text-[#0CC88B] ">
          <button onclick="(function(){var tg=window.Telegram&&window.Telegram.WebApp;if(tg&&typeof tg.openTelegramLink==='function'){tg.openTelegramLink('https://t.me/legitcheck');}else{window.open('https://t.me/legitcheck','_blank','noopener');}})();">У меня нет промокода, но хочу получить</button>
        </div>

        <script>
          window.addEventListener('load', () => {
            const input = document.getElementById('promoCodeInput');
            if (input) input.focus();
          });
        </script>

          
    </section>

  </div>

  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;
      if (!tg) return;
      tg.ready();
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(function () {
          window.history.back();
          tg.BackButton.hide();
        });
      }
    })();</script>

  {% include 'sidebar.html' %}
</body>
</html>
