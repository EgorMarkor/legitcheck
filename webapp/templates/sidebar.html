{% load static %}

<style>
  [data-persistent-shell="bottom-nav"] .bg_sidebar {
    border: 0;
    border-image: none;
    border-image-source: none;
  }
</style>

<div class="fixed bottom-0 w-full flex justify-center" data-persistent-shell="bottom-nav">
  <nav class="bg_sidebar text-gray-300 
              px-4 mx-28 py-2 mb-4 w-full max-w-md 
              rounded-full flex justify-between items-center"
       aria-label="Bottom Navigation">
       
    <!-- Кнопка "Главная" -->
    <a href="{% url 'home' %}" class="flex flex-col items-center">
      {% if request.resolver_match.url_name == 'home' %}
        <img class="w-[1.5rem] h-auto"
             src="{% static 'home_active.svg' %}"
             data-active-src="{% static 'home_active.svg' %}"
             data-inactive-src="{% static 'home.svg' %}"
             alt="">
      {% else %}
        <img class="w-[1.5rem] h-auto"
             src="{% static 'home.svg' %}"
             data-active-src="{% static 'home_active.svg' %}"
             data-inactive-src="{% static 'home.svg' %}"
             alt="">
      {% endif %}
      <span class="text-sm">Главная</span>
    </a>

    <!-- Кнопка "GO" -->
    <a class="relative z-10 bg-green-500 text-white font-bold 
               rounded-full px-5 py-4 ring-4 transform green_button"
       href="{% url 'check' %}">
      GO
    </a>

    <!-- Кнопка "Вердикты" -->
    <a href="{% url 'verdicts' %}" class="flex flex-col items-center">
      {% if request.resolver_match.url_name == 'verdicts' %}
        <img class="w-[1.5rem] h-auto"
             src="{% static 'verdicts_active.svg' %}"
             data-active-src="{% static 'verdicts_active.svg' %}"
             data-inactive-src="{% static 'verdicts.svg' %}"
             alt="">
      {% else %}
        <img class="w-[1.5rem] h-auto"
             src="{% static 'verdicts.svg' %}"
             data-active-src="{% static 'verdicts_active.svg' %}"
             data-inactive-src="{% static 'verdicts.svg' %}"
             alt="">
      {% endif %}
      <span class="text-sm">Вердикты</span>
    </a>

  </nav>
</div>
