<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0f16">
    <!-- PWA / iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Checker">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'pwa/apple-touch-icon-180.png' %}">
    <title>Checker</title>
    <!-- Preconnect: подключаемся к внешним доменам заранее -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://telegram.org">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Sans: загружаем асинхронно -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap"></noscript>
    <!-- Telegram WebApp SDK: defer — не блокирует парсинг -->
    <script src="https://telegram.org/js/telegram-web-app.js?57" defer></script>
    <link rel="manifest" href="/manifest.json">
    <style>
      /* ─── Убираем скроллбары ───────────────────────────────────────────────── */
      * {
        -webkit-overflow-scrolling: touch;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar { width: 0; height: 0; }

      /* ─── Base ─────────────────────────────────────────────────────────────── */
      html {
        font-size: 3.3vw;
        margin-bottom: 2rem;
      }

      body {
        font-family: 'Google Sans', sans-serif;
        padding-bottom: 2rem;
      }

      * { font-family: 'Google Sans', sans-serif; }

      .bg_black {
        background: linear-gradient(180deg, #171C24 0%, #11151A 100%);
      }

      html, body {
        margin: 0;
        min-height: 100%;
        /* Safe area для iPhone с «чёлкой» */
        padding-bottom: constant(safe-area-inset-bottom);
        padding-bottom: env(safe-area-inset-bottom);
        background-color: #0c0f16;
      }

  
      .lg_check_text {
        font-family: Google Sans;
        font-weight: 700;
        font-size: 1rem;
        line-height: 13.73px;
        letter-spacing: 0%;
      }
  
      .our_tg {
        font-family: Google Sans;
        font-weight: 400;
        font-size: 0.8rem;
        line-height: 10.3px;
        letter-spacing: 0%;
        vertical-align: middle;
        color: #464F5D;
      }
  
      .text_pol_confident {
        font-family: Google Sans;
        font-weight: 500;
        font-size: 1.2rem;
        line-height: 100%;
        letter-spacing: 0%;
        text-align: justify;
  
      }
  
      .balance {
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 100%;
        letter-spacing: 0%;
        text-align: justify;
  
      }
    </style>

    
    <script>
      // PWA: service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;

        tg.ready();
        if (typeof tg.disableVerticalSwipes === 'function') {
          tg.disableVerticalSwipes();
        }
        if (tg.themeParams) {
          tg.themeParams.bg_color = "#0c0f16";
          tg.themeParams.secondary_bg_color = "#0c0f16";
          if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor("#0c0f16");
          if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor("#0c0f16");
        }
        if (typeof tg.expand === 'function') tg.expand();
      });
    </script>
    <!-- PWA page transitions + swipe navigation -->
    <script src="{% static 'pwa/transitions.js' %}"></script>
    {% if tg_user %}
    <script>
      localStorage.setItem('checker_auth_token', '{{ tg_user.auth_token }}');
    </script>
    {% endif %}
  </head>
