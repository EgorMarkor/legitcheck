    <script>
      // PWA: service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          var controllerReloaded = false;

          navigator.serviceWorker.addEventListener("controllerchange", function () {
            if (controllerReloaded) return;
            controllerReloaded = true;
            window.location.reload();
          });

          navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(function (registration) {
            if (registration.waiting) {
              registration.waiting.postMessage({ type: "SKIP_WAITING" });
            }
            registration.addEventListener("updatefound", function () {
              var worker = registration.installing;
              if (!worker) return;
              worker.addEventListener("statechange", function () {
                if (worker.state === "installed" && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: "SKIP_WAITING" });
                }
              });
            });
            registration.update().catch(function () {});
          }).catch(function () {});
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        document.addEventListener('contextmenu', function (event) {
          if (!event.target.closest('input, textarea, select, [contenteditable="true"]')) {
            event.preventDefault();
          }
        });

        document.addEventListener('dragstart', function (event) {
          if (!event.target.closest('input, textarea, select, [contenteditable="true"]')) {
            event.preventDefault();
          }
        });

        if (!tg) return;

        tg.ready();
        if (typeof tg.disableVerticalSwipes === 'function') {
          tg.disableVerticalSwipes();
        }
        if (tg.themeParams) {
          tg.themeParams.bg_color = "#0c0f16";
          tg.themeParams.secondary_bg_color = "#0c0f16";
          if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor("#0c0f16");
          if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor("#0c0f16");
        }
        if (typeof tg.expand === 'function') tg.expand();
      });
    </script>
