<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0f16">
    <!-- PWA / iOS standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Checker">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'pwa/apple-touch-icon-180.png' %}">
    <title>Checker</title>
    <!-- Tailwind CSS (self-hosted) -->
    <script src="{% static 'vendor/tailwind-cdn.js' %}"></script>
    <!-- Google Sans (self-hosted) -->
    <link rel="stylesheet" href="{% static 'vendor/google-sans.css' %}">
    <!-- Telegram WebApp SDK: defer — не блокирует парсинг -->
    <script defer src="{% static 'vendor/telegram-web-app.js' %}"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
      /* ─── Убираем скроллбары ───────────────────────────────────────────────── */
      * {
        -webkit-overflow-scrolling: touch;
        -ms-overflow-style: none;
        scrollbar-width: none;
        -webkit-user-select: none;
        user-select: none;
      }
      *::-webkit-scrollbar { width: 0; height: 0; }

      img,
      svg,
      canvas,
      video {
        -webkit-user-drag: none;
        user-select: none;
      }

      html,
      body,
      a,
      img {
        -webkit-touch-callout: none;
      }

      input,
      textarea,
      select,
      [contenteditable="true"] {
        -webkit-user-select: text;
        user-select: text;
        -webkit-touch-callout: default;
      }

      /* ─── Base ─────────────────────────────────────────────────────────────── */
      html {
        font-size: 3.3vw;
        margin-bottom: 2rem;
      }

      body {
        font-family: 'Google Sans', sans-serif;
        padding-bottom: 2rem;
      }

      * { font-family: 'Google Sans', sans-serif; }

      .bg_black {
        background: linear-gradient(180deg, #171C24 0%, #11151A 100%);
      }

            .bg_sidebar {
        background: linear-gradient(
          180deg,
          rgba(29, 36, 48, 0.85) 0%,
          rgba(14, 17, 21, 0.85) 100%
        );
      border-radius: 1000rem;
      border-width: 0.1rem;
      border-style: solid;
      border-image: var(
        --obvodka-temnaya-versiya,
        linear-gradient(
          180deg,
          rgba(179, 214, 255, 0.03) 0%,
          rgba(179, 214, 255, 0) 100%
        )
      );
      border-image-slice: 1;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(1rem);
      }

      .green_button {
        background: linear-gradient(247.01deg, #0CC88B 19.49%, #1D785B 97.92%);
      }

      html, body {
        margin: 0;
        min-height: 100%;
        /* Safe area для iPhone с «чёлкой» */
        padding-bottom: constant(safe-area-inset-bottom);
        padding-bottom: env(safe-area-inset-bottom);
        background-color: #0c0f16;
      }

  
      .lg_check_text {
        font-family: Google Sans;
        font-weight: 700;
        font-size: 1rem;
        line-height: 13.73px;
        letter-spacing: 0%;
      }
  
      .our_tg {
        font-family: Google Sans;
        font-weight: 400;
        font-size: 0.8rem;
        line-height: 10.3px;
        letter-spacing: 0%;
        vertical-align: middle;
        color: #464F5D;
      }
  
      .text_pol_confident {
        font-family: Google Sans;
        font-weight: 500;
        font-size: 1.2rem;
        line-height: 100%;
        letter-spacing: 0%;
        text-align: justify;
  
      }
  
      .balance {
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 100%;
        letter-spacing: 0%;
        text-align: justify;
  
      }

      #page-content {
        min-height: 100vh;
        view-transition-name: page;
      }

      html.app-transitioning,
      html.app-transitioning body {
        overflow-x: hidden;
      }

      @supports (view-transition-name: page) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
          animation: none;
        }

        ::view-transition-group(page) {
          animation-duration: .38s;
          animation-timing-function: cubic-bezier(.32,.72,0,1);
          overflow: clip;
        }

        ::view-transition-old(page),
        ::view-transition-new(page) {
          backface-visibility: hidden;
          mix-blend-mode: normal;
        }

        html.forward::view-transition-old(page) {
          animation: page-old-forward .38s cubic-bezier(.32,.72,0,1) both;
        }

        html.forward::view-transition-new(page) {
          animation: page-new-forward .38s cubic-bezier(.32,.72,0,1) both;
        }

        html.back::view-transition-old(page) {
          animation: page-old-back .38s cubic-bezier(.32,.72,0,1) both;
        }

        html.back::view-transition-new(page) {
          animation: page-new-back .38s cubic-bezier(.32,.72,0,1) both;
        }

        @keyframes page-old-forward {
          from {
            transform: translateX(0) scale(1);
            filter: brightness(1);
          }

          to {
            transform: translateX(-28%) scale(.96);
            filter: brightness(.72);
          }
        }

        @keyframes page-new-forward {
          from {
            transform: translateX(100%);
            box-shadow: -32px 0 80px rgba(0,0,0,.42);
          }

          to {
            transform: translateX(0);
            box-shadow: -12px 0 40px rgba(0,0,0,0);
          }
        }

        @keyframes page-old-back {
          from {
            transform: translateX(0);
            box-shadow: -32px 0 80px rgba(0,0,0,.32);
          }

          to {
            transform: translateX(100%);
          }
        }

        @keyframes page-new-back {
          from {
            transform: translateX(-28%) scale(.96);
            filter: brightness(.72);
          }

          to {
            transform: translateX(0) scale(1);
            filter: brightness(1);
          }
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #page-content {
          view-transition-name: none;
        }

        ::view-transition-group(*),
        ::view-transition-old(*),
        ::view-transition-new(*) {
          animation-duration: 1ms !important;
        }
      }
    </style>

    
    <script>
      // PWA: service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).then(function (registration) {
            registration.update().catch(function () {});
          }).catch(function () {});
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        document.addEventListener('contextmenu', function (event) {
          if (!event.target.closest('input, textarea, select, [contenteditable="true"]')) {
            event.preventDefault();
          }
        });

        document.addEventListener('dragstart', function (event) {
          if (!event.target.closest('input, textarea, select, [contenteditable="true"]')) {
            event.preventDefault();
          }
        });

        if (!tg) return;

        tg.ready();
        if (typeof tg.disableVerticalSwipes === 'function') {
          tg.disableVerticalSwipes();
        }
        if (tg.themeParams) {
          tg.themeParams.bg_color = "#0c0f16";
          tg.themeParams.secondary_bg_color = "#0c0f16";
          if (typeof tg.setHeaderColor === 'function') tg.setHeaderColor("#0c0f16");
          if (typeof tg.setBottomBarColor === 'function') tg.setBottomBarColor("#0c0f16");
        }
        if (typeof tg.expand === 'function') tg.expand();
      });
    </script>
    {% if tg_user %}
    <script>
      localStorage.setItem('checker_auth_token', '{{ tg_user.auth_token }}');
    </script>
    {% endif %}
    <script defer src="{% static 'js/page-transitions.js' %}?v=20260531-7"></script>
  </head>
